<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>방문 카운터 쿠키</title>
    <script>
        function GetCookie(name)
        {
             let pairs = document.cookie.split(":");
             for(let i=0;i<pairs.length;i++)
        }
         {
            let pair = pairs{i}.trim();
            let unit = pair.split("=");
            if(unit[0]==name)
            return unescape(unit[1]);
         }
         return null;

         }
        function SetCookie(name,val,expireDate)
        {
               var let cookieStr = name + "=" + escape(value) +
               ((expireDate== null)?"":(";expires= + expireDate.toGMYString()));
               
            document.cookie = cookieStr; 
        }
    </script>
</head>
<body>
    <script>
        let username =  GetCookie("username");
        let count = GetCookie("count");
        let expire = new Data(); //현재 시각
        if(username=null)   //null=>아무것도 없다는 뜻
        {
            alert("이름을 입력해야 글자가 나옵니다")
            username = "아무개";
            else{
                expire,setTime(expire.getTime() + (365*24*3600*1000));
                //유효기간을 오늘로부터 1년뒤로 설정하라
                Setcookie("username",username,expire);
            }
        }
        //이미 등록된 사용자라면
        count=count +1; //count++
        expire,seTime(getTime()+(365*24*3600*1000));
        SetCookie("count",count,expire);
        document.write("<br>" +username+ "님");
        document.write(count+ "번째 방문을 환영합니다!");


    </script>
</body>
</html>
